["Świat", "Tenis", "Ekspert", "Który tenisista wygrał French Open w 1989 roku jako 17-latek?", ["Michael Chang", "Boris Becker", "Jim Courier", "Andre Agassi"], 0],
["Świat", "Lekkoatletyka", "Ekspert", "Kto zdobył złoto olimpijskie w biegu na 400 m przez płotki w Tokio 2020 z rekordem świata 45,94?", ["Karsten Warholm", "Rai Benjamin", "Alison dos Santos", "Abderrahman Samba"], 0],
["Świat", "Sporty zimowe", "Ekspert", "Który zawodnik zdobył pięć złotych medali olimpijskich w łyżwiarstwie szybkim na igrzyskach w Lake Placid 1980?", ["Eric Heiden", "Sven Kramer", "Johann Olav Koss", "Ireen Wüst"], 0]
];
const view=document.getElementById('view');let profile=load();let setup={difficulty:'Łatwy',region:'Polska',sport:'Koszykówka'};let game=null;let timer=null;const RECENT_KEY='gsquiz-v04-recent';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&typeof p.name==='string'&&Array.isArray(p.history))return p}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(profile));return true}catch(e){return false}}
function trophy(points){return points>=210?['💎','Legenda GS Quiz']:points>=190?['🏆','Platynowe']:points>=150?['🥇','Złote']:points>=100?['🥈','Srebrne']:points>=50?['🥉','Brązowe']:['🎯','Uczestnik']}
function stop(){if(timer){clearInterval(timer);timer=null}}
function buttons(items,current,fn){return '<div class="grid">'+items.map(x=>'<button class="choice" type="button" aria-pressed="'+(x===current)+'" data-value="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'}
function profileScreen(){stop();view.innerHTML='<div class="card"><h1>Profil gracza</h1><p>Wpisz pseudonim. Wyniki zapisujemy tylko w tej przeglądarce.</p><label for="nick">Pseudonim</label><input id="nick" maxlength="24" autocomplete="nickname" placeholder="Np. Mistrz Kosza" value="'+esc(profile?.name||'')+'"><button class="btn full" id="saveProfile">Zapisz profil</button><p class="small">Nie używamy kont ani serwera. Usunięcie danych przeglądarki może usunąć historię.</p></div>';document.getElementById('saveProfile').onclick=()=>{const name=document.getElementById('nick').value.trim();if(!name){alert('Wpisz pseudonim.');return}profile=profile||{name,history:[],badges:[]};profile.name=name;save();home()}}
function home(){stop();if(!profile){profileScreen();return}const hist=profile.history||[],best=hist.reduce((m,g)=>Math.max(m,g.points||0),0),earned=Array.from(new Set(hist.map(g=>trophy(g.points)[1])));view.innerHTML='<div class="card"><h1>Witaj, '+esc(profile.name)+'! 👋</h1><p>Wybierz quiz sportowy i rozpocznij rozgrywkę.</p><div class="stats"><span>Rozegrane: <b>'+hist.length+'</b></span><span>Rekord: <b>'+best+' pkt</b></span></div><div>'+earned.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div></div><div class="card"><h2>Nowa rozgrywka</h2><h3>Poziom</h3><div id="diff"></div><h3 style="margin-top:18px">Zakres</h3><div id="region"></div><h3 style="margin-top:18px">Dyscyplina</h3><div id="sport"></div><p class="small" id="availability"></p><button class="btn full" id="start">Rozpocznij 10 pytań</button></div><div class="card"><h2>Ostatnie wyniki</h2>'+(hist.length?'<ol class="history">'+hist.slice(-5).reverse().map(g=>'<li>'+esc(g.date)+' — '+g.points+' pkt ('+g.correct+'/10) · '+esc(g.sport)+'</li>').join('')+'</ol>':'<p>Nie masz jeszcze zapisanych rozgrywek.</p>')+'</div>';const render=()=>{for(const [id,items,key] of [['diff',['Łatwy','Normalny','Trudny','Ekspert'],'difficulty'],['region',['Polska','Świat'],'region'],['sport',['Ogólne','Koszykówka','Piłka nożna','Siatkówka','Tenis','Lekkoatletyka','Sporty zimowe','Sporty motorowe'],'sport']]){let el=document.getElementById(id);el.innerHTML=buttons(items,setup[key]);el.querySelectorAll('button').forEach(b=>b.onclick=()=>{setup[key]=b.dataset.value;render()})}let count=pool().length;document.getElementById('availability').textContent=count>=10?'Dostępnych pytań: '+count+'. Pytania są losowane, a ostatnio użyte odkładane na później.':'Ta kombinacja ma na razie '+count+' pytań. Wybierz Ogólne albo inną kombinację (potrzeba co najmniej 10).';document.getElementById('start').disabled=count<10};render();document.getElementById('start').onclick=start}
function pool(){return BANK.filter(q=>q[0]===setup.region&&(setup.sport==='Ogólne'||q[1]===setup.sport)&&q[2]===setup.difficulty)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){const p=pool();if(p.length<10)return;let recent=[];try{recent=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){}const chosen=shuffled(p.filter(q=>!recent.includes(q[3]))).concat(shuffled(p.filter(q=>recent.includes(q[3])))).slice(0,10);try{localStorage.setItem(RECENT_KEY,JSON.stringify(chosen.map(q=>q[3]).concat(recent).slice(0,60)))}catch(e){}game={questions:chosen,idx:0,points:0,correct:0,streak:0,maxStreak:0,answered:false,time:30,details:[]};showQuestion()}
function showQuestion(){stop();if(!game||game.idx>=10){finish();return}game.answered=false;game.time=30;const q=game.questions[game.idx];game.choices=shuffled(q[4].map((label,i)=>({label,correct:i===q[5]})));view.innerHTML='<div class="card"><div class="stats"><span>Pytanie <b>'+(game.idx+1)+'/10</b></span><span>Wynik: <b>'+game.points+' pkt</b></span><span>Czas: <b id="time">30 s</b></span></div><div class="bar"><div id="fill" class="fill" style="width:100%"></div></div><p class="small">'+esc(setup.region)+' · '+esc(q[1])+' · '+esc(setup.difficulty)+'</p><h2>'+esc(q[3])+'</h2><div class="answers">'+game.choices.map((c,i)=>'<button type="button" class="choice answer" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(c.label)+'</button>').join('')+'</div><p id="feedback" role="status" class="small"></p></div>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));const deadline=Date.now()+30000;timer=setInterval(()=>{if(!game||game.answered)return;game.time=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('time').textContent=game.time+' s';document.getElementById('fill').style.width=(game.time/30*100)+'%';if(game.time===0)answer(-1)},150)}
function answer(i){if(!game||game.answered)return;game.answered=true;stop();const chosen=game.choices[i];const good=!!chosen?.correct;const time=game.time;let bonus=0,series=0;if(good){game.correct++;game.streak++;game.maxStreak=Math.max(game.maxStreak,game.streak);bonus=Math.min(5,Math.floor(time/6));series=Math.min(10,Math.max(0,(game.streak-1)*2));game.points+=10+bonus+series}else game.streak=0;game.details.push({good,time,bonus,series});document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(game.choices[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').textContent=(good?'Poprawnie! +'+(10+bonus+series)+' pkt':'Niepoprawnie lub koniec czasu.')+' Następne pytanie za chwilę…';setTimeout(()=>{if(!game)return;game.idx++;showQuestion()},1300)}
function finish(){stop();if(!game)return;const g=game;const [emoji,name]=trophy(g.points);const entry={date:new Date().toLocaleDateString('pl-PL'),points:g.points,correct:g.correct,sport:setup.sport,region:setup.region,difficulty:setup.difficulty,maxStreak:g.maxStreak};profile.history.push(entry);profile.history=profile.history.slice(-100);const stored=save();game=null;view.innerHTML='<div class="card" style="text-align:center"><div class="trophy">'+emoji+'</div><h1>'+name+'</h1><p>Rozgrywka zakończona</p><div class="score">'+g.points+' pkt</div><p>Poprawne: '+g.correct+'/10 · Najlepsza seria: '+g.maxStreak+'</p><p class="small">'+(stored?'Wynik zapisany w profilu.':'Uwaga: przeglądarka nie pozwoliła zapisać wyniku.')+'</p><button class="btn full" id="again">Zagraj ponownie</button><button class="btn secondary full" id="back">Menu główne</button></div>';document.getElementById('again').onclick=start;document.getElementById('back').onclick=home}
document.getElementById('profileBtn').onclick=profileScreen;home();
</script></body></html>
