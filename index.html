<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Sport Quiz — prototyp 0.3</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f4f7ff;background:#0d1423}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;padding-bottom:env(safe-area-inset-bottom)}main{max-width:560px;margin:12px auto;background:#182438;border:1px solid #34445b;border-radius:20px;padding:clamp(16px,4vw,28px);box-shadow:0 15px 45px #0003}h1{font-size:24px;margin:0 0 8px}h2{font-size:21px;line-height:1.4;margin:18px 0}p{line-height:1.5}.muted{color:#b7c6dc}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tag{background:#263b58;padding:6px 10px;border-radius:99px;font-size:12px}.choices,.stack{display:grid;gap:10px}.btn,.choice{border:1px solid #516581;background:#243854;color:#fff;padding:15px 14px;border-radius:13px;font-size:16px;min-height:50px;text-align:left;cursor:pointer;touch-action:manipulation}.btn.primary{background:#3679e4;border-color:#5795f9;text-align:center;font-weight:700}.btn:disabled{opacity:.45;cursor:not-allowed}.choice{width:100%;display:flex;align-items:center;gap:14px}.letter{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:8px;background:#3a5275;font-weight:700}.choice.good{background:#165d43;border-color:#36c58a}.choice.bad{background:#71333e;border-color:#ee6576}.choice:disabled{opacity:1}.progress{height:7px;background:#34445b;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#62a4ff;transition:width .15s}.timer{font-size:38px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0}.timer.low{color:#ff7d85}.status{text-align:center;min-height:24px;font-weight:700;margin-top:14px}.center{text-align:center}.big{font-size:40px;font-weight:800}.trophy{font-size:56px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:#253650;padding:14px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:24px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:13px}.review{border-top:1px solid #43536b;padding:12px 0}.review p{margin:4px 0}.ach{background:#233750;border:1px solid #486080;padding:12px;border-radius:12px;margin:8px 0}.hidden{display:none!important}button:focus-visible{outline:3px solid #f7c96a;outline-offset:2px}@media(max-width:390px){main{padding:14px;border-radius:14px}.btn,.choice{font-size:15px;padding:12px}.timer{font-size:34px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="app"><div class="top"><h1>🏆 Sport Quiz</h1><span class="tag">Prototyp 0.3</span></div><div id="screen" aria-live="polite"><p>Ładowanie gry… Jeśli widzisz ten komunikat przez dłuższą chwilę, otwórz link bezpośrednio w Safari.</p></div></main><noscript><p style="padding:20px;color:white">Do uruchomienia gry potrzebna jest włączona obsługa JavaScript. Otwórz stronę w Safari.</p></noscript><script>
'use strict';
const questions=[
{q:'Który polski koszykarz grał w NBA w barwach Washington Wizards?',a:['Marcin Gortat','Adam Waczyński','Mateusz Ponitka','Łukasz Koszarek'],c:0,why:'Marcin Gortat występował w Washington Wizards w latach 2013–2018.'},
{q:'Jak nazywa się najwyższa klasa męskich rozgrywek koszykarskich w Polsce w sezonie 2026/27?',a:['I liga koszykówki','Orlen Basket Liga','Liga Mistrzów FIBA','Puchar Polski'],c:1,why:'Orlen Basket Liga to najwyższa klasa rozgrywkowa mężczyzn w Polsce.'},
{q:'Jakie miejsce zajęła Polska na mistrzostwach świata w koszykówce mężczyzn w 2019 roku?',a:['Czwarte','Szóste','Ósme','Dwunaste'],c:2,why:'Polska zakończyła mistrzostwa świata 2019 na ósmym miejscu.'},
{q:'Który klub koszykarski pochodzi z Wrocławia?',a:['Anwil','Trefl','Start','Śląsk'],c:3,why:'Śląsk Wrocław to jeden z najbardziej utytułowanych klubów polskiej koszykówki.'},
{q:'Który polski koszykarz został wybrany z numerem 9 w drafcie NBA w 2022 roku?',a:['Marcin Gortat','Jeremy Sochan','Maciej Lampe','Cezary Trybański'],c:1,why:'Jeremy Sochan został wybrany z numerem 9 przez San Antonio Spurs.'},
{q:'W którym mieście swoją siedzibę ma klub koszykarski Anwil?',a:['Toruń','Gdynia','Włocławek','Lublin'],c:2,why:'Anwil to klub z Włocławka.'},
{q:'Kto prowadził reprezentację Polski mężczyzn podczas EuroBasketu 2022?',a:['Igor Miličić','Mike Taylor','Andrej Urlep','Žan Tabak'],c:0,why:'Trenerem reprezentacji Polski podczas EuroBasketu 2022 był Igor Miličić.'},
{q:'W którym mieście swoje mecze domowe rozgrywa koszykarski Trefl?',a:['Gdynia','Gdańsk','Sopot','Koszalin'],c:2,why:'Trefl jest klubem z Sopotu.'},
{q:'Jak nazywa się klub koszykarski ze Szczecina, który zdobył mistrzostwo Polski w 2023 roku?',a:['King','Start','Anwil','Arka'],c:0,why:'King Szczecin zdobył mistrzostwo Polski w 2023 roku.'},
{q:'Jakie miejsce zajęła Polska na EuroBaskecie mężczyzn w 2022 roku?',a:['Drugie','Trzecie','Czwarte','Ósme'],c:2,why:'Polska zajęła czwarte miejsce na EuroBaskecie 2022.'}
];
const tiers=[{min:0,name:'Debiutant',icon:'👟'},{min:50,name:'Rezerwowy',icon:'🥉'},{min:90,name:'Zawodnik',icon:'🥈'},{min:130,name:'Kapitan',icon:'🥇'},{min:170,name:'Mistrz',icon:'🏆'},{min:200,name:'Legenda Sportu',icon:'👑'}];
let phase='home',difficulty='Łatwy',region='Polska',category='Koszykówka',idx=0,score=0,streak=0,bestStreak=0,correctCount=0,fastCount=0,elapsed=0,remaining=30,locked=false,history=[],timer=null,advanceTimer=null,earned=[];
const $=()=>document.getElementById('screen');
function safeLoad(){try{return JSON.parse(localStorage.getItem('sportQuizV02')||'{}')}catch(e){return {}}}
function safeSave(data){try{localStorage.setItem('sportQuizV02',JSON.stringify(data))}catch(e){}}
function stop(){if(timer!==null){clearInterval(timer);timer=null}if(advanceTimer!==null){clearTimeout(advanceTimer);advanceTimer=null}}
function button(label,fn,cls='btn'){const b=document.createElement('button');b.className=cls;b.type='button';b.textContent=label;b.addEventListener('click',fn);return b}
function renderHome(){stop();phase='home';const s=$();s.innerHTML='<p class="muted">10 pytań • 30 sekund na pytanie • cztery odpowiedzi</p><h2>Wybierz rozgrywkę</h2><p class="muted small">Wersja testowa: dostępna baza Łatwy → Polska → Koszykówka. Pozostałe ścieżki pojawią się po rozbudowie pytań.</p>';const wrap=document.createElement('div');wrap.className='stack';wrap.append(button('▶ Zagraj: Łatwy / Polska / Koszykówka',start,'btn primary'),button('🏅 Moje odznaki',renderBadges));s.append(wrap)}
function start(){stop();phase='play';idx=0;score=0;streak=0;bestStreak=0;correctCount=0;fastCount=0;elapsed=0;history=[];renderQuestion()}
function renderQuestion(){stop();locked=false;remaining=30;phase='play';const q=questions[idx];const s=$();s.innerHTML=`<div class="top"><span class="tag">🇵🇱 Polska • 🏀 Koszykówka</span><span class="tag">${score} pkt</span></div><div class="row"><p class="muted">Pytanie ${idx+1} / 10</p><p class="muted">Seria: ${streak} 🔥</p></div><div class="progress"><div class="fill" style="width:${idx*10}%"></div></div><div id="timer" class="timer">00:30</div><h2>${q.q}</h2><div id="choices" class="choices"></div><div id="status" class="status" role="status"></div>`;
const choices=document.getElementById('choices');q.a.forEach((answer,i)=>{const b=button('',()=>choose(i),'choice');const l=document.createElement('span');l.className='letter';l.textContent='ABCD'[i];const txt=document.createElement('span');txt.textContent=answer;b.append(l,txt);choices.append(b)});
const started=Date.now();timer=setInterval(()=>{if(locked)return;remaining=Math.max(0,30-(Date.now()-started)/1000);const t=document.getElementById('timer');if(t){t.textContent='00:'+String(Math.ceil(remaining)).padStart(2,'0');t.classList.toggle('low',remaining<=5)}if(remaining<=0)choose(null)},100)}
function choose(selected){if(locked)return;locked=true;if(timer!==null){clearInterval(timer);timer=null}const q=questions[idx],timeUsed=selected===null?30:Math.min(30,30-remaining),ok=selected===q.c;elapsed+=timeUsed;let earnedPoints=0;if(ok){correctCount++;streak++;bestStreak=Math.max(bestStreak,streak);if(timeUsed<=5)fastCount++;const timeBonus=Math.max(0,Math.round(5*(30-timeUsed)/30));const streakBonus=Math.min(10,Math.max(0,streak-1)*2);earnedPoints=10+timeBonus+streakBonus;score+=earnedPoints}else streak=0;history.push({selected,correct:q.c,ok,timeUsed,points:earnedPoints});const btns=document.querySelectorAll('#choices button');btns.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('good');if(i===selected&&!ok)b.classList.add('bad')});document.getElementById('status').textContent=selected===null?'⏰ Czas minął! Poprawna: '+q.a[q.c]:ok?'✅ Dobrze! +'+earnedPoints+' pkt':'❌ Poprawna: '+q.a[q.c];advanceTimer=setTimeout(()=>{advanceTimer=null;if(idx===9)finish();else{idx++;renderQuestion()}},1500)}
function finish(){stop();phase='result';const previous=safeLoad();const badges=new Set(Array.isArray(previous.badges)?previous.badges:[]);if(correctCount===10)badges.add('Snajper');if(fastCount>=5)badges.add('Błyskawica');if(bestStreak>=5)badges.add('Seria zwycięstw');const played=(Number(previous.played)||0)+1;const basketball=(Number(previous.basketball)||0)+1;if(basketball>=10)badges.add('Specjalista');earned=[...badges].filter(x=>!(previous.badges||[]).includes(x));safeSave({badges:[...badges],played,basketball,best:Math.max(score,Number(previous.best)||0)});const trophy=[...tiers].reverse().find(x=>score>=x.min);const s=$();s.innerHTML=`<div class="center"><div class="trophy">${trophy.icon}</div><h2>${trophy.name}</h2><div class="big">${score} pkt</div><p class="muted">Łatwy • Polska • Koszykówka</p></div><div class="stats"><div class="stat"><strong>${correctCount}/10</strong>Poprawne</div><div class="stat"><strong>${bestStreak}</strong>Najdłuższa seria</div><div class="stat"><strong>${Math.round(elapsed)} s</strong>Czas odpowiedzi</div><div class="stat"><strong>${fastCount}</strong>Odp. do 5 s</div></div>`;if(earned.length){const p=document.createElement('p');p.textContent='🎉 Nowe odznaki: '+earned.join(', ');s.append(p)}const actions=document.createElement('div');actions.className='stack';actions.append(button('Zagraj ponownie',start,'btn primary'),button('Przejrzyj odpowiedzi',renderReview),button('Moje odznaki',renderBadges),button('Ekran startowy',renderHome));s.append(actions)}
function renderReview(){phase='review';const s=$();s.innerHTML='<h2>Przegląd odpowiedzi</h2>';history.forEach((h,i)=>{const q=questions[i];const d=document.createElement('div');d.className='review';const title=document.createElement('strong');title.textContent=(i+1)+'. '+q.q;d.append(title);const p=document.createElement('p');p.textContent='Twoja odpowiedź: '+(h.selected===null?'brak':q.a[h.selected])+' • '+(h.ok?'✓':'✗')+' • +'+h.points+' pkt';d.append(p);const a=document.createElement('p');a.className='muted small';a.textContent='Poprawna: '+q.a[q.c]+'. '+q.why;d.append(a);s.append(d)});s.append(button('Wróć do wyniku',renderResultAgain,'btn primary'))}
function renderResultAgain(){const h=history.slice();const saved=earned.slice();finishWithoutSaving(h,saved)}
function finishWithoutSaving(h,saved){phase='result';const trophy=[...tiers].reverse().find(x=>score>=x.min);const s=$();s.innerHTML=`<div class="center"><div class="trophy">${trophy.icon}</div><h2>${trophy.name}</h2><div class="big">${score} pkt</div><p class="muted">Łatwy • Polska • Koszykówka</p></div><div class="stats"><div class="stat"><strong>${correctCount}/10</strong>Poprawne</div><div class="stat"><strong>${bestStreak}</strong>Najdłuższa seria</div><div class="stat"><strong>${Math.round(elapsed)} s</strong>Czas odpowiedzi</div><div class="stat"><strong>${fastCount}</strong>Odp. do 5 s</div></div>`;const actions=document.createElement('div');actions.className='stack';actions.append(button('Zagraj ponownie',start,'btn primary'),button('Przejrzyj odpowiedzi',renderReview),button('Moje odznaki',renderBadges),button('Ekran startowy',renderHome));s.append(actions)}
function renderBadges(){stop();phase='badges';const data=safeLoad(),badges=new Set(data.badges||[]);const list=[['🎯','Snajper','10 poprawnych w jednym quizie'],['⚡','Błyskawica','5 odpowiedzi w czasie do 5 sekund w jednym quizie'],['🔥','Seria zwycięstw','5 poprawnych z rzędu'],['🧠','Ekspert','Ukończ quiz na poziomie Ekspert (niedostępne w prototypie)'],['🌍','Obieżyświat','Ukończ 10 quizów Świat (niedostępne w prototypie)'],['🏀','Specjalista','Ukończ 10 quizów koszykówki']];const s=$();s.innerHTML='<h2>Moje odznaki</h2><p class="muted small">Zapis lokalny w przeglądarce, jeśli pozwalają na to jej ustawienia.</p>';list.forEach(([icon,name,desc])=>{const d=document.createElement('div');d.className='ach';d.textContent=icon+' '+name+' — '+desc+' '+(badges.has(name)?'✅':'🔒');s.append(d)});s.append(button('Wróć do startu',renderHome,'btn primary'))}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&phase==='play'&&!locked){/* Timer counts real elapsed time after returning to the tab. */}});try{renderHome()}catch(error){document.getElementById('screen').textContent='Nie udało się uruchomić gry: '+(error&&error.message?error.message:String(error));}
</script></body></html>
