<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>GS Quiz 0.6</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4f7ff;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#20375a,#0b1220 65%)}main{max-width:670px;margin:auto;padding:24px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{font-size:26px;font-weight:900;letter-spacing:.03em}.tag{color:#9cb6d9;font-size:12px}.card{background:#17243a;border:1px solid #344862;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px #0002}h1,h2,h3{margin:0 0 12px}p{color:#c3d0e3;line-height:1.5}.muted{color:#9db0cb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice,.btn{border:1px solid #486080;border-radius:12px;padding:13px 14px;background:#233550;color:white;font:inherit;cursor:pointer;text-align:left;min-height:48px}.choice[aria-pressed=true]{background:#275e9d;border-color:#78baff}.choice:disabled{opacity:.65;cursor:default}.btn{background:#4e95f3;color:#07182e;border:0;font-weight:800;text-align:center}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#273c58;color:#f1f6ff}.full{width:100%;margin-top:12px}.answers{display:grid;gap:10px}.answer{width:100%;text-align:left}.answer.correct{background:#14634c;border-color:#35d8a2}.answer.wrong{background:#7e303c;border-color:#f88b9b}.bar{height:10px;border-radius:99px;background:#354966;overflow:hidden}.fill{height:100%;background:#5aafff;transition:width .2s linear}.stats{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:14px}.score{font-size:34px;font-weight:900}.trophy{font-size:48px}.hidden{display:none!important}input{width:100%;padding:13px;border:1px solid #59708f;border-radius:10px;background:#0e192a;color:white;font:inherit}label{display:block;margin-bottom:8px;font-weight:700}.small{font-size:13px}.history{padding-left:20px;color:#c3d0e3}.pill{display:inline-block;background:#284361;border-radius:99px;padding:6px 10px;font-size:13px;margin:4px 4px 0 0}button:focus-visible,input:focus-visible{outline:3px solid #ffda77;outline-offset:2px}@media(max-width:380px){.grid{grid-template-columns:1fr}.brand{font-size:22px}.card{padding:16px}}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body><main><header class="top"><div><div class="brand">🏆 GS QUIZ</div><div class="tag">Wersja testowa 0.6 · Sport</div></div><button id="profileBtn" class="choice small" type="button">Profil</button></header><section id="view" aria-live="polite"></section></main><script>
'use strict';
const KEY='gsquiz-v03-profile';
let BANK=[];

const view=document.getElementById('view');let profile=load();let setup={difficulty:'Łatwy',region:'Polska',sport:'Koszykówka'};let game=null;let timer=null;const TARGET_PER_GROUP=100;const LEVELS=['Łatwy','Normalny','Trudny','Ekspert'];const REGIONS=['Polska','Świat'];const RECENT_KEY='gsquiz-v04-recent';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&typeof p.name==='string'&&Array.isArray(p.history))return p}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(profile));return true}catch(e){return false}}
function trophy(points){return points>=210?['💎','Legenda GS Quiz']:points>=190?['🏆','Platynowe']:points>=150?['🥇','Złote']:points>=100?['🥈','Srebrne']:points>=50?['🥉','Brązowe']:['🎯','Uczestnik']}
function stop(){if(timer){clearInterval(timer);timer=null}}
function buttons(items,current,fn){return '<div class="grid">'+items.map(x=>'<button class="choice" type="button" aria-pressed="'+(x===current)+'" data-value="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'}
function profileScreen(){stop();view.innerHTML='<div class="card"><h1>Profil gracza</h1><p>Wpisz pseudonim. Wyniki zapisujemy tylko w tej przeglądarce.</p><label for="nick">Pseudonim</label><input id="nick" maxlength="24" autocomplete="nickname" placeholder="Np. Mistrz Kosza" value="'+esc(profile?.name||'')+'"><button class="btn full" id="saveProfile">Zapisz profil</button><p class="small">Nie używamy kont ani serwera. Usunięcie danych przeglądarki może usunąć historię.</p></div>';document.getElementById('saveProfile').onclick=()=>{const name=document.getElementById('nick').value.trim();if(!name){alert('Wpisz pseudonim.');return}profile=profile||{name,history:[],badges:[]};profile.name=name;save();home()}}
function bankProgress(){const rows=LEVELS.map(d=>REGIONS.map(r=>{const n=BANK.filter(q=>q.difficulty===d&&q.region===r).length;return '<tr><td>'+esc(d)+'</td><td>'+esc(r)+'</td><td>'+n+'/100</td><td>'+Math.max(0,TARGET_PER_GROUP-n)+'</td></tr>'}).join('')).join('');return '<details class="card"><summary style="cursor:pointer;font-weight:800">📚 Rozwój bazy pytań: '+BANK.length+'/800</summary><p class="small">Cel: 100 pytań na każdy poziom i region. To liczba wszystkich pytań, niezależnie od dyscypliny.</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left;line-height:2"><thead><tr><th>Poziom</th><th>Region</th><th>Jest</th><th>Brakuje</th></tr></thead><tbody>'+rows+'</tbody></table></div></details>'}
function home(){stop();if(!profile){profileScreen();return}const hist=profile.history||[],best=hist.reduce((m,g)=>Math.max(m,g.points||0),0),earned=Array.from(new Set(hist.map(g=>trophy(g.points)[1])));view.innerHTML='<div class="card"><h1>Witaj, '+esc(profile.name)+'! 👋</h1><p>Wybierz quiz sportowy i rozpocznij rozgrywkę.</p><div class="stats"><span>Rozegrane: <b>'+hist.length+'</b></span><span>Rekord: <b>'+best+' pkt</b></span></div><div>'+earned.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div></div><div class="card"><h2>Nowa rozgrywka</h2><h3>Poziom</h3><div id="diff"></div><h3 style="margin-top:18px">Zakres</h3><div id="region"></div><h3 style="margin-top:18px">Dyscyplina</h3><div id="sport"></div><p class="small" id="availability"></p><button class="btn full" id="start">Rozpocznij 10 pytań</button></div><div class="card"><h2>Ostatnie wyniki</h2>'+(hist.length?'<ol class="history">'+hist.slice(-5).reverse().map(g=>'<li>'+esc(g.date)+' — '+g.points+' pkt ('+g.correct+'/10) · '+esc(g.sport)+'</li>').join('')+'</ol>':'<p>Nie masz jeszcze zapisanych rozgrywek.</p>')+'</div>'+bankProgress();const render=()=>{for(const [id,items,key] of [['diff',['Łatwy','Normalny','Trudny','Ekspert'],'difficulty'],['region',['Polska','Świat'],'region'],['sport',['Ogólne','Koszykówka','Piłka nożna','Siatkówka','Tenis','Lekkoatletyka','Sporty zimowe','Sporty motorowe'],'sport']]){let el=document.getElementById(id);el.innerHTML=buttons(items,setup[key]);el.querySelectorAll('button').forEach(b=>b.onclick=()=>{setup[key]=b.dataset.value;render()})}let count=pool().length;document.getElementById('availability').textContent=count>=10?'Dostępnych pytań: '+count+'. Pytania są losowane, a ostatnio użyte odkładane na później.':'Ta kombinacja ma na razie '+count+' pytań. Wybierz Ogólne albo inną kombinację (potrzeba co najmniej 10).';document.getElementById('start').disabled=count<10};render();document.getElementById('start').onclick=start}
function pool(){return BANK.filter(q=>q.region===setup.region&&(setup.sport==='Ogólne'||q.sport===setup.sport)&&q.difficulty===setup.difficulty)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){const p=pool();if(p.length<10)return;let recent=[];try{recent=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){}const chosen=shuffled(p.filter(q=>!recent.includes(q.id))).concat(shuffled(p.filter(q=>recent.includes(q.id)))).slice(0,10);try{localStorage.setItem(RECENT_KEY,JSON.stringify(chosen.map(q=>q.id).concat(recent).slice(0,60)))}catch(e){}game={questions:chosen,idx:0,points:0,correct:0,streak:0,maxStreak:0,answered:false,time:30,details:[]};showQuestion()}
function showQuestion(){stop();if(!game||game.idx>=10){finish();return}game.answered=false;game.time=30;const q=game.questions[game.idx];game.choices=shuffled(q.answers.map((label,i)=>({label,correct:i===q.correctIndex})));view.innerHTML='<div class="card"><div class="stats"><span>Pytanie <b>'+(game.idx+1)+'/10</b></span><span>Wynik: <b>'+game.points+' pkt</b></span><span>Czas: <b id="time">30 s</b></span></div><div class="bar"><div id="fill" class="fill" style="width:100%"></div></div><p class="small">'+esc(setup.region)+' · '+esc(q.sport)+' · '+esc(setup.difficulty)+'</p><h2>'+esc(q.question)+'</h2><div class="answers">'+game.choices.map((c,i)=>'<button type="button" class="choice answer" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(c.label)+'</button>').join('')+'</div><p id="feedback" role="status" class="small"></p></div>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));const deadline=Date.now()+30000;timer=setInterval(()=>{if(!game||game.answered)return;game.time=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('time').textContent=game.time+' s';document.getElementById('fill').style.width=(game.time/30*100)+'%';if(game.time===0)answer(-1)},150)}
function answer(i){if(!game||game.answered)return;game.answered=true;stop();const chosen=game.choices[i];const good=!!chosen?.correct;const time=game.time;let bonus=0,series=0;if(good){game.correct++;game.streak++;game.maxStreak=Math.max(game.maxStreak,game.streak);bonus=Math.min(5,Math.floor(time/6));series=Math.min(10,Math.max(0,(game.streak-1)*2));game.points+=10+bonus+series}else game.streak=0;game.details.push({good,time,bonus,series});document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(game.choices[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').textContent=(good?'Poprawnie! +'+(10+bonus+series)+' pkt':'Niepoprawnie lub koniec czasu.')+' Następne pytanie za chwilę…';setTimeout(()=>{if(!game)return;game.idx++;showQuestion()},1300)}
function finish(){stop();if(!game)return;const g=game;const [emoji,name]=trophy(g.points);const entry={date:new Date().toLocaleDateString('pl-PL'),points:g.points,correct:g.correct,sport:setup.sport,region:setup.region,difficulty:setup.difficulty,maxStreak:g.maxStreak};profile.history.push(entry);profile.history=profile.history.slice(-100);const stored=save();game=null;view.innerHTML='<div class="card" style="text-align:center"><div class="trophy">'+emoji+'</div><h1>'+name+'</h1><p>Rozgrywka zakończona</p><div class="score">'+g.points+' pkt</div><p>Poprawne: '+g.correct+'/10 · Najlepsza seria: '+g.maxStreak+'</p><p class="small">'+(stored?'Wynik zapisany w profilu.':'Uwaga: przeglądarka nie pozwoliła zapisać wyniku.')+'</p><button class="btn full" id="again">Zagraj ponownie</button><button class="btn secondary full" id="back">Menu główne</button></div>';document.getElementById('again').onclick=start;document.getElementById('back').onclick=home}
async function loadQuestions(){
  view.innerHTML='<div class="card"><h2>Wczytywanie pytań…</h2><p>Proszę chwilę poczekać.</p></div>';
  try{
    const response=await fetch('./questions.json',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(!Array.isArray(data)||data.length===0)throw new Error('Baza pytań jest pusta.');
    const ids=new Set();
    for(const q of data){
      if(!q||typeof q.id!=='string'||!q.id.trim()||ids.has(q.id)||!['Polska','Świat'].includes(q.region)||typeof q.sport!=='string'||!q.sport.trim()||!['Łatwy','Normalny','Trudny','Ekspert'].includes(q.difficulty)||typeof q.question!=='string'||!q.question.trim()||!Array.isArray(q.answers)||q.answers.length!==4||q.answers.some(a=>typeof a!=='string'||!a.trim())||!Number.isInteger(q.correctIndex)||q.correctIndex<0||q.correctIndex>3||(q.answers.map(a=>a.trim().toLocaleLowerCase('pl-PL')).some((a,i,arr)=>arr.indexOf(a)!==i)))throw new Error('Nieprawidłowe pytanie: '+(q?.id||'?'));
      ids.add(q.id);
    }
    BANK=data;
    home();
  }catch(err){
    view.innerHTML='<div class="card"><h2>Nie udało się wczytać pytań</h2><p>Sprawdź, czy plik <b>questions.json</b> znajduje się obok <b>index.html</b> na GitHubie. Przy otwieraniu HTML bezpośrednio z dysku przeglądarka może blokować wczytywanie pliku.</p><p class="small" id="err"></p><button class="btn full" id="retry">Spróbuj ponownie</button></div>';
    document.getElementById('err').textContent=String(err.message||err);
    document.getElementById('retry').onclick=loadQuestions;
  }
}
document.getElementById('profileBtn').onclick=()=>{if(BANK.length)profileScreen()};loadQuestions();
</script></body></html>
